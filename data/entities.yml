# ============================================================
# Mass AI Atlas — community dataset (DATA)
# ------------------------------------------------------------
# To add an entry: copy an existing entry, fill in every field,
# and open a pull request. Full instructions: CONTRIBUTING.md
# Validate locally with:  node scripts/validate.js
# ------------------------------------------------------------
# Entry fields:
#   id      unique kebab-case string
#   name    display name
#   cat     one of the keys in categories.yml
#   loc     address or neighborhood label
#   lat,lng coordinates (Massachusetts)
#   approx  true if coordinates are neighborhood-level
#   url     official https:// website
#   badge   optional highlight, e.g. "Applications open"
#   desc    1-2 sentence factual description
#   why     why it matters for founders
#   tags    2-4 short lowercase tags
#   stages  founder stages 1-5 (stages.yml) where this resource helps
#   links   ids of related entries (drawn in Galaxy view)
#   lastVerified
#           the month ("YYYY-MM") a maintainer last confirmed the org
#           is real, active, and the entry's facts are right — set it
#           when you actually checked the org, not merely when you
#           edited the entry
# ============================================================

