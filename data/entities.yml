- id: ndif
  name: National Deep Inference Fabric (Northeastern)
  cat: university
  loc: 216 Massachusetts Ave, Boston
  approx: true
  lat: 42.3449
  lng: -71.0854
  url: https://ndif.us
  badge: $9M NSF project
  desc: 'NSF-funded research computing project led by David Bau (PI and director) at Northeastern''s Khoury College: free remote access to large open-weight models (Llama 3.1 up to 405B, GPT-OSS 120B, Qwen, Gemma and OLMo families) on NCSA''s Delta cluster at UIUC, plus the open-source NNsight library for inspecting and editing model internals. The $9M award runs May 2024 to April 2028.'
  why: 'For founders building interpretability, evals or AI-safety tooling: free API access to open models up to 405B with their internals exposed, so you can run intervention experiments without renting GPUs. The 1,200+-member Discord and bi-weekly reading group are online and national, not a Boston meetup; the team itself sits in Khoury College. Needs US residency or a US-based collaborator; research use, not production inference.'
  facts: [[Focus, Interpretability of large open-weight models], [Terms, Free; US residency or US collaborator]]
  tags: [research, AI safety, infrastructure, Northeastern]
