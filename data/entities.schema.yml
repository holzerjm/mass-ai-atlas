$schema: http://json-schema.org/draft-07/schema#
$id: entities.schema.yml
title: Mass AI Atlas entries (DATA)
description: >-
  One object per organization. Rules that span records or files are checked in
  scripts/validate.js rather than here: unique ids and names, `cat` is a key of
  categories.yml, `stages` are stage numbers in stages.yml, `links` resolve to
  existing ids, `added`/`lastVerified` not in the future, plus warnings (missing
  optional fields, non-canonical tags, passed applyBy dates).
type: array
items:
  type: object
  # offers is required, not just encouraged: an entry without it is invisible to
  # the Directory's "I need…" filter, the main way founders search, so it must not
  # be mergeable (a warning once let the suggestion bot emit drafts without it)
  required: [id, name, cat, loc, lat, lng, url, desc, offers]
  additionalProperties: false
  properties:
    id:
      description: unique kebab-case string
      type: string
      pattern: &kebab ^[a-z0-9]+(-[a-z0-9]+)*$
    name:
      description: display name
      type: string
      # nohtml: text fields are prose — HTML has no legitimate use here and is an XSS vector
      pattern: &nohtml ^[^<>]*$
      minLength: 1
    cat:
      description: one of the keys in categories.yml
      type: string
    loc:
      description: address or neighborhood label
      type: string
      pattern: *nohtml
      minLength: 1
    lat:
      description: latitude (Massachusetts bounding box — a typo guard, not a geofence)
      type: number
      minimum: 41.1
      maximum: 42.95
    lng:
      description: longitude (Massachusetts bounding box — a typo guard, not a geofence)
      type: number
      minimum: -73.6
      maximum: -69.85
    approx:
      description: true if coordinates are neighborhood-level
      type: boolean
    url:
      description: official https:// website, without characters unsafe in a link
      type: string
      pattern: ^https://[^\s"'<>\\]*$
    badge:
      description: optional highlight, e.g. "Applications open"
      type: string
      pattern: *nohtml
    desc:
      description: 1-2 sentence factual description
      type: string
      pattern: *nohtml
      minLength: 1
      maxLength: 400
    why:
      description: why it matters for founders
      type: string
      pattern: *nohtml
    tags:
      description: 2-4 short lowercase tags (vocabulary in scripts/validate.js)
      type: array
      items:
        type: string
        pattern: *nohtml
    stages:
      description: founder stages (the `n` values in stages.yml) where this resource helps
      type: array
      items:
        type: integer
    links:
      description: ids of related entries (drawn in Galaxy view)
      type: array
      items:
        type: string
        pattern: *kebab
    offers:
      description: what the org gives founders
      type: array
      minItems: 1
      maxItems: 6
      items:
        enum: [funding, grants, space, compute, mentorship, community, talent, customers]
    applyBy:
      description: '"rolling" or the next application deadline as "YYYY-MM-DD"'
      anyOf:
        - const: rolling
        - type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
    applyNote:
      description: short note shown next to the deadline, or on its own while applications are closed
      type: string
      pattern: *nohtml
      maxLength: 40
    applyUrl:
      description: direct https:// link to the application page, when it isn't the homepage
      type: string
      pattern: ^https://[^\s"'<>\\]*$
    facts:
      description: 1-6 [label, value] pairs
      type: array
      minItems: 1
      maxItems: 6
      items:
        type: array
        items:
          - enum: [Check size, Stage, Terms, Equity, Board seat, Program length, Cohort size, Focus]
          - type: string
            pattern: *nohtml
            maxLength: 48
        minItems: 2
        additionalItems: false
    added:
      description: the month ("YYYY-MM") the entry joined the atlas
      type: string
      pattern: &month ^\d{4}-(0[1-9]|1[0-2])$
    lastVerified:
      description: >-
        the month ("YYYY-MM") a maintainer last confirmed the org is real,
        active, and the entry's facts are right — set it when you actually
        checked the org, not merely when you edited the entry
      type: string
      pattern: *month
