# Credits: the people outside the core team whose work is in the atlas, and the
# milestones of how it got here. Rendered by credits/index.html, checked by
# scripts/validate.js against credits.schema.yml.
#
# Consent. A GitHub handle and that person's public pull requests and issues are
# public already, so every entry starts with just those. Add `name`, or
# `photo: true` to show their GitHub avatar, only after the person has said yes.
# Anyone can ask to change or remove their credit through `corrections`.
#
# When an outside contribution merges, credit it in the same pull request: add
# the person below, or add a link and any new kind to their entry. People only:
# no bots, and no AI co-authors. Sponsors are thanked on the atlas page itself,
# and credit here can't be bought.
#
# A copy of this template inherits this file. Keep crediting the people who
# built the atlas upstream, and add your own below them.

contributing: https://github.com/holzerjm/mass-ai-atlas/blob/main/CONTRIBUTING.md
corrections: https://github.com/holzerjm/mass-ai-atlas/issues/new?title=Credits%3A%20

mapmakers:
