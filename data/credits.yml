    since: 2026-06-15
    kinds: [data]
    story: "Suggested Ven^X and Epipelagic Ventures through the entry form, the first suggestions to come from outside the core team. Both are on the map."
    links:
      - { label: "Issue #8", url: "https://github.com/holzerjm/mass-ai-atlas/issues/8" }
      - { label: "Issue #9", url: "https://github.com/holzerjm/mass-ai-atlas/issues/9" }

  - github: graiz
    since: 2026-06-23
