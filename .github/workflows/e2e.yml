# Browser suite (see docs/testing.md). Covers the four views, deep links,
# the shortlist, the events page and accessibility.
# (`npx playwright test --list` prints the current count; don't type it here.)
#
# NOT a required check, on purpose, and that is the whole point of this file.
#
# Every spec renders a WebGL basemap and the Galaxy canvas, so the suite is
# sensitive to how many browsers run at once. Locally, on a machine with less GPU
# headroom, `axe: galaxy view` fails under parallel workers and passes 3/3 when run
# alone. Whether that happens on a GitHub runner is unknown — so this runs and
# reports, and nobody is blocked by it, until there is enough history to say.
#
# To promote it once the history looks clean: add both of its checks, "e2e (1 of 2)"
# and "e2e (2 of 2)", to the required status checks of the `main` ruleset. To demote
# it again: remove them. Nothing in this file changes either way.
#
# The same tests also run in WebKit, the engine Safari is built on, as "webkit, report
# only (1 of 2)" and "(2 of 2)". Leave those two out of the required checks, promotion
# or not. Nothing else here tests Safari's engine, but this is Playwright's own WebKit
# build on Linux, not Safari: a failure only there is a lead to check in a real Safari,
# not a reason on its own to hold a merge.
#
# Unlike deploy/weekly-events/monthly-health, this is deliberately NOT restricted to
# the upstream repository: a copy made from this template should absolutely run it.
name: Browser tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e:
    name: ${{ matrix.label }} (${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    # Playwright's own image has Chromium, WebKit and their system libraries built in, so
    # no step installs them. Until 2026-11 one did, and on some runners it took 8 to 10
    # minutes. Keep the tag equal to @playwright/test's version in package-lock.json: if
    # they drift, every test fails at launch with Playwright's own message naming the
    # image it needs. --ipc=host is what Playwright recommends for Chromium in Docker,
    # whose default shared memory is too small for it.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # Each browser runs the suite as two jobs of half each, all four at once: about
    # 5 minutes per Chromium job instead of 10 to 12. fail-fast is off, so a WebKit
    # failure never cancels a Chromium job.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2]
        include:
          - browser: chromium
            label: e2e
            report: playwright-report
          - browser: webkit
            label: webkit, report only
            report: playwright-report-webkit
    timeout-minutes: 25
    env:
      ATLAS_BROWSER: ${{ matrix.browser }}   # playwright.config.js picks the browser from it
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      # The HTML report is what makes a failure diagnosable without a local repro.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.report }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
