# Hands-off deploys — rsync the atlas to the web server on every merge to
# main that touches index.html or data/, so accepted community PRs go
# live automatically. Can also be run manually from the Actions tab
# (workflow_dispatch), e.g. to test the pipeline.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY     dedicated private key authorized on the server
#                      (never commit it; revoke server-side to disable)
#   DEPLOY_HOST        the ORIGIN server IP — not the domain: the domain
#                      resolves to Cloudflare's proxy, which won't pass SSH
#   DEPLOY_USER        ssh user on the server
#   DEPLOY_PATH        docroot ecosystem dir — "/" when the key is
#                      rrsync-restricted to that dir (it is)
#   SLACK_WEBHOOK_URL  optional — TOA Slack incoming webhook; deploy and
#                      failure notifications are skipped when unset
#
# data/ is validated before anything is copied, so a broken dataset can
# never ship even if it somehow reaches main. Manual fallback if this
# workflow is ever unavailable: scripts/sync-to-site.sh from a local checkout.

name: Deploy to TOA site

on:
  push:
    branches: [main]
    paths: ["index.html", "atlas-data.js", "data/**", "map-style-dark.json", "events/**"]
  workflow_dispatch:

jobs:
  deploy:
    # This repository is also a GitHub template. A copy made from it is a new repo
    # with Actions enabled but none of TOA's deploy target, Slack webhooks or bot
    # credentials, so this job could only fail there. Skip it instead of handing a
    # team a red X they did not cause. Upstream, nothing changes.
    # NOTE: if the atlas ever moves to a TOA organization, update this slug or the
    # job stops running here too. It is the only place the slug is hardcoded.
    if: github.repository == 'holzerjm/mass-ai-atlas'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the Slack step can diff the push
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Validate data/ before shipping
        run: node scripts/validate.js
      - name: Generate public dataset (atlas.json + atlas.csv)
        run: |
          node scripts/export-json.js
          node scripts/export-csv.js
      - name: Build entry share pages + sitemap
        run: node scripts/build-pages.js
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Rsync atlas
        run: |
          rsync -avz -e "ssh -i ~/.ssh/id_deploy" index.html atlas-data.js map-style-dark.json atlas.json atlas.csv site-pages/sitemap.xml \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"
          # the page fetches data/*.yml (data + schemas) at load time
          rsync -avz -e "ssh -i ~/.ssh/id_deploy" data/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/data/"
          rsync -avz -e "ssh -i ~/.ssh/id_deploy" events/index.html \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/events/"
          # entry stubs: --delete is scoped to the e/ subtree only, so removed
          # entries' share pages clean up without touching anything else
          rsync -avz --delete -e "ssh -i ~/.ssh/id_deploy" site-pages/e/ \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/e/"

      - name: Notify Slack (deployed)
        if: success()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; }

          COUNT=$(node -e 'console.log(require("./scripts/load-data").loadData().DATA.length)')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_URL="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          SHORT_SHA=$(git rev-parse --short HEAD)

          # What changed: commit subjects for the pushed range, plus the
          # entities.yml entry-level delta (new ids vs. changed existing entries).
          NEW_NAMES=""; UPDATED=0
          if [ "$EVENT_NAME" = "push" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git rev-parse -q --verify "$BEFORE_SHA^{commit}" >/dev/null; then
            RANGE="$BEFORE_SHA..HEAD"
            SUBJECTS=$(git log --pretty='• %s' "$RANGE" | grep -v '^• chore:' | head -5)
            # compare parsed entries by id; an older commit without
            # data/entities.yml yields no delta
            OLD_YML=$(git show "$BEFORE_SHA:data/entities.yml" 2>/dev/null || true)
            if [ -n "$OLD_YML" ]; then
              DELTA_OUT=$(printf '%s' "$OLD_YML" | node -e '
                const yaml=require("js-yaml");
                const old=yaml.load(require("fs").readFileSync(0,"utf8"),{schema:yaml.CORE_SCHEMA})||[];
                const before=new Map(old.map(d=>[d.id,JSON.stringify(d)]));
                const {DATA}=require("./scripts/load-data").loadData();
                const added=DATA.filter(d=>!before.has(d.id)).map(d=>d.name);
                const updated=DATA.filter(d=>before.has(d.id)&&before.get(d.id)!==JSON.stringify(d)).length;
                console.log(updated); console.log(added.join(", "));')
              UPDATED=$(printf '%s\n' "$DELTA_OUT" | sed -n 1p)
              NEW_NAMES=$(printf '%s\n' "$DELTA_OUT" | sed -n 2p)
            fi
          else
            SUBJECTS="• Manual deploy of the current state"
          fi

          DELTA=""
          [ -n "$NEW_NAMES" ] && DELTA="✨ *New:* ${NEW_NAMES}"
          if [ "$UPDATED" -gt 0 ]; then
            [ -n "$DELTA" ] && DELTA="$DELTA · "
            DELTA="${DELTA}✏️ *Updated:* ${UPDATED} entr$( [ "$UPDATED" = 1 ] && echo y || echo ies)"
          fi

          # Feature releases: bullet lines ("- " / "* ") in the head commit's body
          # become their own "What shipped" section, so the notification can say
          # more than one subject line when a release warrants it.
          FEATURES=$(git log -1 --pretty=%b | sed -nE 's/^[-*] +/• /p' | head -8)

          jq -n --arg count "$COUNT" --arg subjects "$SUBJECTS" --arg delta "$DELTA" \
                --arg features "$FEATURES" \
                --arg run "$RUN_URL" --arg commit "$COMMIT_URL" --arg sha "$SHORT_SHA" '
            {text: ("🗺️ Mass AI Atlas updated — " + $count + " organizations live"),
             blocks: ([
               {type:"header", text:{type:"plain_text", text:"🗺️ Mass AI Atlas updated", emoji:true}},
               {type:"section", text:{type:"mrkdwn",
                 text:("*" + $count + " organizations* live at <https://the-open-accelerator.com/ecosystem/|the-open-accelerator.com/ecosystem>\n" + $subjects)}}
             ]
             + (if $features != "" then [{type:"section", text:{type:"mrkdwn", text:("*What shipped*\n" + $features)}}] else [] end)
             + (if $delta != "" then [{type:"section", text:{type:"mrkdwn", text:$delta}}] else [] end)
             + [{type:"context", elements:[{type:"mrkdwn",
                 text:("<" + $commit + "|`" + $sha + "`> · <" + $run + "|deploy log> · via GitHub Actions")}]}])
            }' \
          | curl -sS -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"

      - name: Notify Slack (deploy failed)
        if: failure()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; }
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUBJECT=$(git log -1 --pretty=%s 2>/dev/null || echo "unknown commit")
          jq -n --arg subject "$SUBJECT" --arg run "$RUN_URL" '
            {text: "🚨 Mass AI Atlas deploy FAILED",
             blocks: [
               {type:"header", text:{type:"plain_text", text:"🚨 Atlas deploy failed", emoji:true}},
               {type:"section", text:{type:"mrkdwn",
                 text:("`" + $subject + "`\nThe live site is *unchanged*. <" + $run + "|View the failed run> to see what broke.")}}
             ]}' \
          | curl -sS -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"
