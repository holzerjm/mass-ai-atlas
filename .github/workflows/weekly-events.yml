# Weekly events refresh — builds events.json (Boston AI events, next 10 days),
# ships it to /ecosystem/events.json, and posts the list to the TOA Scouts
# Slack. Target: Monday 7am Eastern, year-round.
#
# Who starts it: a plain cron on the origin server (toa-forge) dispatches this
# workflow at 11:01, 12:01 and 13:01 UTC on Mondays (and 12:01 UTC Tuesdays as a
# retry) via scripts/trigger-weekly-events.sh
# — GitHub's own scheduler delivered this repo's Monday firings 5-6 hours late
# (2026-09-07) and not at all by mid-morning (2026-09-14). GitHub's crons below
# stay as fallbacks: Monday every couple of hours, then Tuesday and Wednesday.
#
# Why that is safe: one gate decides. A run does the work only if it is at or
# after 7am Eastern on the most recent Monday AND the live events.json has not
# been regenerated since then. So the first arrival does the work, every later
# one skips in seconds, a missed Monday is self-healed on Tuesday, and EDT/EST
# needs no special handling because the gate reads the clock, not the cron.
#
# Secrets: DEPLOY_* (shared with deploy.yml) ship the file;
# SLACK_SCOUTS_WEBHOOK_URL posts the list (skipped silently if unset).

name: Weekly events refresh

permissions:
  contents: read   # nothing here uses GITHUB_TOKEN beyond checkout

on:
  schedule:
    - cron: "7 11 * * 1"   # 7:07am EDT (6:07am EST → gate skips)
    - cron: "7 12 * * 1"   # 8:07am EDT / 7:07am EST
    - cron: "7 13 * * 1"   # Monday fallbacks — GitHub often delivers these hours late
    - cron: "7 15 * * 1"
    - cron: "7 17 * * 1"
    - cron: "7 12 * * 2"   # Tue/Wed: run only if Monday was missed entirely
    - cron: "7 12 * * 3"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the once-a-week gate: refresh and post to Slack right now"
        type: boolean
        default: false

# Serialize runs: if the server dispatch and a GitHub cron land together, the
# second waits, then its gate sees the freshly shipped file and skips.
concurrency:
  group: weekly-events-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # This repository is also a GitHub template. A copy made from it is a new repo
    # with Actions enabled but none of TOA's deploy target, Slack webhooks or bot
    # credentials, so this job could only fail there. Skip it instead of handing a
    # team a red X they did not cause. Upstream, nothing changes.
    # NOTE: if the atlas ever moves to a TOA organization, update this slug or the
    # job stops running here too. It is the only place the slug is hardcoded.
    if: github.repository == 'holzerjm/mass-ai-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 15          # a hung ssh/rsync must not hold the concurrency group for hours
    defaults:
      run:
        shell: bash              # bash -eo pipefail: a crash behind a pipe (node | tee) is a red step
    env:
      LIVE_URL: https://the-open-accelerator.com/ecosystem/events.json
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci

      - name: Gate (once per week — first run at/after Monday 7am Eastern that finds a stale live file)
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          decide() { echo "run=$1" >> "$GITHUB_OUTPUT"; echo "Gate: $2"; echo "**Gate:** $2" >> "$GITHUB_STEP_SUMMARY"; }
          # Reference point: 7am Eastern on the most recent Monday (today, if it is Monday).
          NOW_ET=$(TZ=America/New_York date "+%Y-%m-%dT%H:%M:%S")
          TODAY_ET=$(TZ=America/New_York date "+%Y-%m-%d")
          SINCE_MON=$(( $(TZ=America/New_York date "+%u") - 1 ))
          MON7="$(TZ=America/New_York date -d "$TODAY_ET $SINCE_MON days ago" "+%Y-%m-%d")T07:00:00"
          echo "monday=${MON7%%T*}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            decide true "running (forced by manual dispatch)"; exit 0
          fi
          if [[ "$NOW_ET" < "$MON7" ]]; then
            decide false "skipped — $NOW_ET Eastern is before this Monday's 7am; a later firing covers this week"; exit 0
          fi
          # Retry hard: a single transient failure here on a firing AFTER this week's refresh would
          # read as "stale" and produce a second refresh and a second Slack post.
          GEN=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 10 --max-time 20 -H 'Cache-Control: no-cache' "$LIVE_URL?cb=$(date +%s%N)" | jq -r '.generated // empty' 2>/dev/null || true)
          GEN_ET=""
          if [ -n "$GEN" ]; then
            GEN_ET=$(TZ=America/New_York date -d "$GEN" "+%Y-%m-%dT%H:%M:%S" 2>/dev/null || true)
          fi
          if [ -n "$GEN_ET" ] && [[ "$GEN_ET" > "$MON7" || "$GEN_ET" == "$MON7" ]]; then
            decide false "skipped — live events.json already regenerated at $GEN_ET Eastern, after Monday 7am; this week's refresh is done"; exit 0
          fi
          if [ -n "$GEN_ET" ]; then
            decide true "running — $NOW_ET Eastern; live file last generated $GEN_ET Eastern, before this Monday 7am"
          else
            decide true "running — $NOW_ET Eastern; could not read the live file, refreshing to be safe (the Verify step will fail loudly if it stays unreadable)"
          fi

      - name: Fetch events
        if: steps.gate.outputs.run == 'true'
        run: |
          node scripts/fetch-events.js | tee fetch.log
          { echo '## Events refresh'; echo '```'; cat fetch.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Do not ship a broken refresh: it would lock the week with a fresh timestamp and post "0 events".
          # A genuinely quiet week (0 events, 0 errors) is fine. Refuse when most of the 8 source slots failed
          # (5+), or when nothing was found while something failed. One host outage (e.g. both AI Tinkerers
          # slots) plus a Luma flake must still ship.
          if ! jq -e '((.errors | length) <= 4) and (.total > 0 or (.errors | length) == 0)' events.json >/dev/null; then
            echo "::error::refresh looks broken, not shipping: $(jq -c '{total, errors}' events.json)"; exit 1
          fi

      - name: Ship events.json
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          rsync -avz -e "ssh -i ~/.ssh/id_deploy -o ConnectTimeout=20" events.json \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Verify the live file shows this refresh
        if: steps.gate.outputs.run == 'true'
        run: |
          # The gate decides by reading this URL; if a refresh can never be seen there, every later
          # firing would run again. Make that one red run here instead of a week of Slack posts.
          WANT=$(jq -r .generated events.json)
          for i in 1 2 3 4 5 6; do
            GOT=$(curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 20 -H 'Cache-Control: no-cache' "$LIVE_URL?cb=$(date +%s%N)" | jq -r '.generated // empty' 2>/dev/null || true)
            if [ "$GOT" = "$WANT" ]; then echo "live file confirmed: generated=$GOT"; exit 0; fi
            echo "attempt $i: live generated='$GOT', want '$WANT'"; sleep 10
          done
          echo "::error::the live events.json does not show the refresh just shipped (want generated=$WANT). Slack was NOT posted, and later firings this week will skip because the file is now fresh. Check DEPLOY_PATH and Cloudflare cache rules; once the live file shows the new generated value, re-run with force=true to post."; exit 1

      - name: Post to TOA Scouts Slack
        if: steps.gate.outputs.run == 'true'
        env:
          SLACK_SCOUTS_WEBHOOK_URL: ${{ secrets.SLACK_SCOUTS_WEBHOOK_URL }}
          MONDAY: ${{ steps.gate.outputs.monday }}
        run: |
          [ -z "$SLACK_SCOUTS_WEBHOOK_URL" ] && { echo "SLACK_SCOUTS_WEBHOOK_URL not set — skipping"; exit 0; }
          LIST=$(node -e '
            const j=require("./events.json");
            const tz={timeZone:"America/New_York"};
            const day=d=>new Intl.DateTimeFormat("en-US",{weekday:"short",month:"short",day:"numeric",...tz}).format(d);
            const tm=d=>new Intl.DateTimeFormat("en-US",{hour:"numeric",minute:"2-digit",...tz}).format(d);
            const LIMIT=2700; // Slack caps a section at 3000 chars; leave room for the trailer
            let cur="", out=[], len=0, shown=0;
            for(const e of j.events){
              const d=new Date(e.start), k=day(d), lines=[];
              if(k!==cur) lines.push("*"+k+"*");
              lines.push("• "+tm(d)+" — <"+e.url+"|"+e.title.replace(/[<>|]/g," ")+">"+(e.organizer?" · "+e.organizer.replace(/[<>|]/g," "):""));
              const add=lines.join("\n").length+1;
              if(len+add>LIMIT || shown>=18) break;
              out.push(...lines); len+=add; shown++; cur=k;
            }
            if(shown<j.events.length) out.push("_… and "+(j.events.length-shown)+" more on the page_");
            if(!out.length) out.push("_Quiet stretch — no AI events found for the coming days. Know of one? Reply here or use ➕ on the page._");
            console.log(out.join("\n"));')
          COUNT=$(node -e 'console.log(require("./events.json").total)')
          WEEK=$(date -d "$MONDAY" "+%B %-d")   # the Monday this post belongs to, even on a Tue/Wed fallback
          RESP=$(jq -n --arg list "$LIST" --arg count "$COUNT" --arg week "$WEEK" '
            {text: ("🗓️ Boston AI events, week of " + $week + " — " + $count + " in the next 10 days"),
             blocks: [
               {type:"header", text:{type:"plain_text", text:("🗓️ This week in Boston AI · " + $week), emoji:true}},
               {type:"section", text:{type:"mrkdwn", text:("*" + $count + " events in the next 10 days* — full list at <https://the-open-accelerator.com/ecosystem/events/|the-open-accelerator.com/ecosystem/events>")}},
               {type:"section", text:{type:"mrkdwn", text:$list}},
               {type:"context", elements:[{type:"mrkdwn", text:"Spot a missing event? Reply here or use the ➕ on the events page. Refreshed every Monday 7am."}]}
             ]}' \
          | curl -sS --max-time 30 -X POST -H 'Content-type: application/json' -d @- "$SLACK_SCOUTS_WEBHOOK_URL" || true)
          if [ "$RESP" != "ok" ]; then
            echo "::error::Slack did not accept the post (response: '${RESP:-none}'). The file is live; re-run with force=true after fixing the webhook."; exit 1
          fi
          echo "Slack: ok"
