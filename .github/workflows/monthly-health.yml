# Monthly health check — the "keep 'verified' true" rails.
# On the 1st of each month (and on demand): run the link-rot checker and
# the verification rota, post both to the TOA Slack, and mirror them in
# the job summary. A report, not a gate — it never fails the build.
#
# NOTE: GitHub disables cron workflows after ~60 days without repo
# activity. This repo's badge-bot commits normally keep it alive; if the
# repo goes fully quiet for a quarter, re-enable from the Actions tab.
#
# Timeouts are not decoration. On 2026-09-01 the link check printed its
# full report in 40 seconds and then never exited (Node's fetch holds
# pooled sockets open); with no timeout anywhere, the job idled until
# GitHub's 6-hour cap cancelled it mid-step, so the rota and the Slack
# post never ran and the month's report was lost in the logs. The script
# now exits explicitly; these timeouts are the backstop, and the link
# check is continue-on-error so a bad sweep degrades the report instead
# of silently costing us the whole month's health check.

name: Monthly health check

on:
  schedule:
    - cron: "0 13 1 * *"   # 1st of the month, 13:00 UTC (~9am Boston)
  workflow_dispatch:

jobs:
  health:
    # This repository is also a GitHub template. A copy made from it is a new repo
    # with Actions enabled but none of TOA's deploy target, Slack webhooks or bot
    # credentials, so this job could only fail there. Skip it instead of handing a
    # team a red X they did not cause. Upstream, nothing changes.
    # NOTE: if the atlas ever moves to a TOA organization, update this slug or the
    # job stops running here too. It is the only place the slug is hardcoded.
    if: github.repository == 'holzerjm/mass-ai-atlas'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci

      - name: Link-rot check
        timeout-minutes: 12      # 8 workers × ~170 URLs × 15s+retry fits well inside this
        continue-on-error: true  # a stalled sweep must not cost us the rota and the Slack post
        run: |
          node scripts/linkcheck.js | tee linkcheck.txt
          { echo '## Link check'; echo '```'; cat linkcheck.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Verification rota
        run: |
          node scripts/stale.js --cycle 12 | tee rota.txt
          { echo '## Verification rota'; echo '```'; cat rota.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Post to Slack
        if: always()          # the month's report goes out even if a step above stumbled
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "SLACK_WEBHOOK_URL not set — skipping"; exit 0; }
          # `|| true` so a missing report file cannot abort this step under bash -e
          SUMMARY=$(head -1 linkcheck.txt 2>/dev/null || true)
          LINKS=$(tail -n +2 linkcheck.txt 2>/dev/null | grep -E '^(BROKEN|MOVED|  )' | head -25 || true)
          # head -40 is a safety rail, not the rota size — --cycle sets that. At 15
          # it silently cut the list short the moment the rota outgrew it.
          ROTA=$(tail -n +2 rota.txt 2>/dev/null | grep '^  ' | head -40 || true)
          # Say so out loud rather than posting a blank-looking all-clear
          [ -z "$SUMMARY" ] && SUMMARY="Link check did not finish — see the run log"
          [ -z "$ROTA" ] && ROTA="  (rota unavailable — see the run log)"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          jq -n --arg summary "$SUMMARY" --arg links "$LINKS" --arg rota "$ROTA" --arg repo "$REPO_URL" '
            {text: ("🩺 Atlas monthly health check — " + $summary),
             blocks: ([
               {type:"header", text:{type:"plain_text", text:"🩺 Atlas monthly health check", emoji:true}},
               {type:"section", text:{type:"mrkdwn", text:("*" + $summary + "*")}}
             ]
             + (if $links != "" then [{type:"section", text:{type:"mrkdwn",
                 text:("*Needs attention:*\n```" + $links + "```")}}] else [] end)
             + [{type:"section", text:{type:"mrkdwn",
                 text:("*This month'\''s verification queue:*\n```" + $rota + "```")}},
                {type:"context", elements:[{type:"mrkdwn",
                 text:("Fix an entry: edit data/entities.yml on <" + $repo + "|GitHub>, bump lastVerified, merge — it deploys itself.")}]}])
            }' \
          | curl -sS -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"
