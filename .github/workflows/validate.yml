name: Validate atlas data

# Runs on every PR (no path filter) so "validate" can be a required status
# check in main's branch protection — a path-filtered required check never
# reports on PRs outside its paths and would block them forever.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "atlas-data.js", "package.json", "package-lock.json"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Validate data/ against the schemas
        run: node scripts/validate.js
      # Dependency-free, so it runs even before npm ci. Catches a count typed into
      # prose, which is how the footer came to claim 101 organizations for months
      # while the atlas listed 171.
      - name: Copy lint (no hand-typed organization counts)
        run: node scripts/lint-copy.js
      - name: Freshness report (informational, never fails the build)
        continue-on-error: true
        run: node scripts/stale.js >> "$GITHUB_STEP_SUMMARY"
