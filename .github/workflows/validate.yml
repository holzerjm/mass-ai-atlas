name: Validate atlas data

# Runs on every PR (no path filter) so "validate" can be a required status
# check in main's branch protection — a path-filtered required check never
# reports on PRs outside its paths and would block them forever.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", "atlas-data.js", "package.json", "package-lock.json", "index.html", "events/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Validate data/ against the schemas
        run: node scripts/validate.js
      # Needs no npm packages, though here it runs after npm ci. Catches a count or a
      # curation month typed into prose, which is how the footer came to claim 101
      # organizations for months while the atlas listed 171.
      - name: Copy lint (no hand-typed organization counts)
        run: node scripts/lint-copy.js
      # events/index.html is generated from index.html by
      # scripts/build-events-page.js, and nothing else rebuilds it, so a change to
      # index.html's chrome used to leave the committed page silently stale (its
      # footer claimed 101 organizations for months). Rebuild it here and fail if
      # that changes the file. A generator that can no longer run, because an
      # index.html change removed a piece it lifts, fails here too.
      - name: Events page matches its generator
        run: |
          node scripts/build-events-page.js
          git diff --exit-code -- events/index.html || {
            echo "::error file=events/index.html::events/index.html is out of date with index.html. Run node scripts/build-events-page.js and commit the result."
            exit 1
          }
      # index.html loads atlas-data.js?v=<a short hash of the file>. Cloudflare and
      # browsers cache .js files for hours, so a loader changed at an unchanged
      # address could reach visitors as the old cached copy, next to a new
      # index.html. Fail if the version in index.html no longer matches the file.
      - name: Loader version matches atlas-data.js
        run: node scripts/loader-version.js
      # scripts/kpi.js feeds a monthly Slack post, where a wrong figure would look
      # as plausible as a right one. Its tests are offline and take a few seconds;
      # none of them depends on what data/ holds, so a data edit cannot fail them.
      - name: KPI script tests
        run: node --test test/kpi.test.js
      # scripts/precheck.js, below, and what it stands on. Offline, like the KPI tests.
      - name: Pre-check script tests
        run: node --test test/precheck.test.js
      - name: Freshness report (informational, never fails the build)
        continue-on-error: true
        run: node scripts/stale.js >> "$GITHUB_STEP_SUMMARY"

  # Advice for a reviewer, never a gate. For each entry a pull request changes it answers 5 of the 8
  # questions in MAINTAINING.md (Part 2, Step 3): does the website work, does the pin match the
  # address, does the town match the pin, is it a duplicate, is the date current. It reads public
  # websites and the Census Bureau's geocoder, so it is a job of its own, with its own time limit,
  # and it can neither fail the build nor hold up the required "validate" check. The report is in
  # the job summary; a warning also marks the line in the file.
  precheck:
    name: pre-check (advice only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2   # the pull request's merge commit, and its first parent: the branch it goes into
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Pre-check the entries this pull request changes
        run: node scripts/precheck.js --base "HEAD^1" --annotations
